<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistemas_HAR</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --card: #1f2937;
        --accent: #38bdf8;
        --text: #e5e7eb;
        --muted: #94a3b8;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg), #111827 55%, #0b1120);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      .container {
        width: min(90vw, 700px);
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 2rem;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.45);
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      p {
        margin: 0.5rem 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .badge {
        display: inline-block;
        padding: 0.35rem 0.8rem;
        border-radius: 999px;
        background: rgba(56, 189, 248, 0.12);
        color: var(--accent);
        border: 1px solid rgba(56, 189, 248, 0.3);
        font-size: 0.8rem;
        margin-bottom: 1rem;
      }

      .actions {
        margin-top: 1.5rem;
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }

      .btn {
        display: inline-block;
        text-decoration: none;
        padding: 0.8rem 1.2rem;
        border-radius: 10px;
        font-weight: 600;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: var(--accent);
        color: #082f49;
      }

      .secondary {
        background: transparent;
        border: 1px solid rgba(148, 163, 184, 0.35);
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main class="container">
      <div class="badge">Proyecto</div>
      <h1>Sistemas_HAR</h1>
      <p>Bienvenido a la página principal del repositorio.</p>
      <p>Este archivo sirve como punto de entrada para visualizar el proyecto en el navegador.</p>

      <div class="actions">
        <a class="btn primary" href="README.md">Ver README</a>
        <a class="btn secondary" href="hola.py">Abrir archivo Python</a>
      </div>
    </main>
  </body>
</html>
