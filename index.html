<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hola</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 40px;
        background: #f4f4f4;
        color: #222;
      }

      h1 {
        text-align: center;
      }

      table {
        width: 60%;
        margin: 20px auto;
        border-collapse: collapse;
        background: white;
      }

      th, td {
        border: 1px solid #ccc;
        padding: 10px;
        text-align: left;
      }

      th {
        background: #eaeaea;
      }
    </style>
  </head>
  <body>
    <h1>Hola</h1>

    <table>
      <thead>
        <tr>
          <th>Nombre</th>
          <th>Edad</th>
          <th>Ciudad</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Ana</td>
          <td>20</td>
          <td>Madrid</td>
        </tr>
        <tr>
          <td>José</td>
          <td>25</td>
          <td>Sevilla</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
